<!doctype html>
<html lang="he">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Git Workflow Agent</title>
  <style>
    :root {
      --bg: #f6f5f1;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #0f766e;
      --accent: #ea580c;
      --border: #e2e8f0;
      --ok: #166534;
      --stop: #991b1b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Rubik", "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 0%, #d1fae5 0%, transparent 35%),
        radial-gradient(circle at 80% 100%, #ffedd5 0%, transparent 35%),
        var(--bg);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(920px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 18px 60px rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }

    .header {
      padding: 22px 24px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(90deg, rgba(15,118,110,0.08), rgba(234,88,12,0.08));
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(24px, 3.5vw, 34px);
      letter-spacing: -0.02em;
    }

    .sub {
      margin: 0;
      color: var(--muted);
    }

    .body {
      padding: 20px 24px 24px;
      display: grid;
      gap: 14px;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .intent {
      flex: 1;
      min-width: 260px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 16px;
      background: #fff;
      color: var(--text);
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .12s ease, filter .12s ease;
    }

    .btn:hover { transform: translateY(-1px); filter: brightness(1.02); }
    .btn:active { transform: translateY(0); }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-alt { background: var(--accent); color: #fff; }

    .quick {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 14px;
    }

    pre {
      margin: 0;
      padding: 16px;
      background: #0b1020;
      color: #e2e8f0;
      border-radius: 14px;
      min-height: 260px;
      overflow: auto;
      white-space: pre-wrap;
      line-height: 1.45;
    }

    .legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px;
      color: var(--muted);
    }

    .ok { color: var(--ok); font-weight: 600; }
    .stop { color: var(--stop); font-weight: 600; }
  </style>
</head>
<body>
  <main class="card">
    <section class="header">
      <h1>Git Workflow Agent</h1>
      <p class="sub">הקלידי "בוקר טוב" או "לילה טוב" והאייג'נט יריץ את הוורקפלואו מול הריפו המקומי.</p>
    </section>

    <section class="body">
      <div class="row">
        <input id="intent" class="intent" placeholder='לדוגמה: בוקר טוב' />
        <button class="btn btn-primary" id="runBtn">הרץ</button>
        <button class="btn btn-alt" id="clearBtn">נקה פלט</button>
      </div>

      <div class="quick">
        <button class="chip" data-intent="בוקר טוב">בוקר טוב</button>
        <button class="chip" data-intent="לילה טוב">לילה טוב</button>
      </div>

      <div class="legend">
        <span class="ok">PASS/READY</span>
        <span class="stop">STOP</span>
        <span>השרת רץ לוקאלית בלבד על 127.0.0.1</span>
      </div>

      <pre id="output">מוכן להרצה.</pre>
    </section>
  </main>

  <script>
    const intentInput = document.getElementById('intent');
    const output = document.getElementById('output');
    const runBtn = document.getElementById('runBtn');
    const clearBtn = document.getElementById('clearBtn');

    async function runIntent(message) {
      const text = (message || '').trim();
      if (!text) {
        output.textContent = 'נא להקליד הודעה, למשל: בוקר טוב או לילה טוב';
        return;
      }

      runBtn.disabled = true;
      output.textContent = 'מריץ...';

      try {
        const res = await fetch('/api/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });

        const data = await res.json();
        output.textContent = data.ok ? data.report : ('ERROR: ' + (data.error || 'Unknown error'));
      } catch (err) {
        output.textContent = 'ERROR: ' + err.message;
      } finally {
        runBtn.disabled = false;
      }
    }

    runBtn.addEventListener('click', () => runIntent(intentInput.value));
    clearBtn.addEventListener('click', () => { output.textContent = 'מוכן להרצה.'; });
    intentInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') runIntent(intentInput.value);
    });

    document.querySelectorAll('.chip').forEach((btn) => {
      btn.addEventListener('click', () => {
        intentInput.value = btn.dataset.intent;
        runIntent(btn.dataset.intent);
      });
    });
  </script>
</body>
</html>
